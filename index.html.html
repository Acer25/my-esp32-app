<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Smart Joint Monitor</title>
<style>
:root{--bg:#e8f0fe;--cd:#fff;--tx:#202124;--mu:#5f6368;--ac:#1a73e8;--ln:#dadce0;--ok:#188038;--wn:#b06000;--cr:#d93025;--of:#5f6368;--okb:#e6f4ea;--wnb:#fef7e0;--crb:#fce8e6;--ofb:#e8eaed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#202124;--cd:#2d2e30;--tx:#e8eaed;--mu:#9aa0a6;--ac:#8ab4f8;--ln:#3c4043;--ok:#81c995;--wn:#fdd663;--cr:#f28b82;--of:#9aa0a6;--okb:#1e3a29;--wnb:#3d3416;--crb:#4a2220;--ofb:#3c4043}}
:root[data-theme=dark]{--bg:#202124;--cd:#2d2e30;--tx:#e8eaed;--mu:#9aa0a6;--ac:#8ab4f8;--ln:#3c4043;--ok:#81c995;--wn:#fdd663;--cr:#f28b82;--of:#9aa0a6;--okb:#1e3a29;--wnb:#3d3416;--crb:#4a2220;--ofb:#3c4043}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:12px}h1{font-size:20px;margin:0}h2{font-size:17px;margin:18px 0 8px;color:var(--ac)}p{margin:6px 0}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.app{display:flex;min-height:100vh}.ct{flex:1;min-width:0;max-width:1200px;padding:16px 20px}
#nav{width:230px;flex:none;align-self:flex-start;position:sticky;top:0;height:100vh;box-sizing:border-box;background:linear-gradient(180deg,#0d47a1,#1565c0);color:#fff;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
#nav .br{font-weight:700;font-size:17px;padding:8px 10px 16px}#nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#e3f2fd;text-align:left;border-radius:8px;padding:10px 12px;position:relative}#nav button.on{background:rgba(255,255,255,.22);color:#fff;font-weight:600}#nav .sh{display:none}#nav .ic{font-size:18px}#nav .bd{background:#d93025;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:auto}#nav .dv{margin-top:auto;font-size:12px;background:rgba(255,255,255,.14);border-radius:8px;padding:10px}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}.dgrid>div>.card,.dgrid>div>div:not(.g){margin-bottom:12px}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}.cg .card{margin:0}
.kh{display:flex;align-items:center;gap:8px}.ic2{width:30px;height:30px;border-radius:50%;background:var(--cd);display:inline-flex;align-items:center;justify-content:center;font-size:15px}.kf{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px}
@media(max-width:800px){.app{flex-direction:column}#nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;gap:0;padding:4px 2px;z-index:9;justify-content:space-around}#nav .br,#nav .dv{display:none}#nav button{flex-direction:column;gap:0;padding:6px 2px;font-size:10px;flex:1;justify-content:center}#nav .tx{display:none}#nav .sh{display:block}#nav .bd{position:absolute;top:2px;right:4px;margin:0}.ct{padding:12px 12px 84px}.dgrid{grid-template-columns:1fr}.cg{grid-template-columns:1fr}}
button,select,input{font:inherit;color:inherit}
button{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:9px 14px;min-height:40px;cursor:pointer}
button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
input,select{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:8px;width:100%;box-sizing:border-box}input[type=checkbox]{width:auto}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(60,64,67,.15)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.g .card{margin:0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.v{font-size:28px;font-weight:700}.v small{font-size:14px;font-weight:400;color:var(--mu);margin-left:4px}
.l,.mu{color:var(--mu);font-size:13px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;border:1px solid currentColor}
.s-ok{color:var(--ok);background:var(--okb)}.s-wn{color:var(--wn);background:var(--wnb)}.s-cr{color:var(--cr);background:var(--crb)}.s-of{color:var(--of);background:var(--ofb)}
.b-ok{border-left:5px solid var(--ok);background:var(--okb)}.b-wn{border-left:5px solid var(--wn);background:var(--wnb)}.b-cr{border-left:5px solid var(--cr);background:var(--crb)}.b-of{border-left:5px solid var(--of);background:var(--ofb)}.b-ok .v{color:var(--ok)}.b-wn .v{color:var(--wn)}.b-cr .v{color:var(--cr)}
.bn{padding:8px 12px;border-radius:8px;margin:8px 0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--ac)}
.sc{overflow-x:auto}svg text{fill:var(--mu);font-size:11px}
.gt{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
footer{color:var(--mu);font-size:12px;margin-top:20px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><div class="app"><aside id="nav"></aside><div class="ct">
<header><h1 id="ttl"></h1><div id="hd"></div></header>
<div id="demo"></div><main id="main"></main>
<footer>JHI is a prototype monitoring indicator, not a replacement for independent safety limits. Safety-critical protection must run locally on the ESP32 or dedicated hardware, never in this app.</footer></div></div>
<script>
const $=s=>document.querySelector(s),f=(x,n)=>x==null||!isFinite(x)?'—':Number(x).toFixed(n),tm=t=>new Date(t).toLocaleTimeString([], {hour12:false}),dt=t=>new Date(t).toLocaleString([], {hour12:false});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=(a,k)=>a.reduce((s,x)=>s+x[k],0)/a.length;
const U={R:'mΩ',T:'°C',F:'N',V:'mV',I:'A',P:'W',J:'/100',rise:'°C'},DG={R:3,T:1,F:0,V:2,I:1,P:2,J:0,rise:1},LN=[['ok','✔','Normal'],['wn','▲','Warning'],['cr','✖','Critical']];
const NAV=[['dash','Dashboard','▦','Home'],['live','Live monitoring','📈','Live'],['pm','Predictive maintenance','🛠️','Predict'],['al','Alerts','🔔','Alerts'],['set','Device settings','⚙️','Device'],['rec','Maintenance records','📋','Logs'],['about','About','ℹ️','Info']],IC={F:'🔩',I:'⚡',V:'🔌',R:'Ω',T:'🌡️',P:'🔥',rise:'📈'};
const NM={R:'Joint resistance',T:'Joint temperature',F:'Contact force',V:'Voltage drop',I:'Current',J:'JHI',C:'Connection'};
const MSG={R:['Joint resistance has increased significantly.','Inspect the joint for looseness or contamination.'],T:['Joint temperature is rising above its established baseline.','Check load, ventilation and joint tightness.'],F:['Contact force is below the configured acceptable range.','Verify bolt torque and washer preload.'],V:['Abnormal joint voltage drop detected. Inspection recommended.','Check measurement leads, then inspect joint surfaces.'],I:['Current is above the configured limit.','Verify load; local protection should handle overcurrent.']};
const CRIT='Critical electrical condition detected. Follow the approved safety procedure.',CACT='De-energise and isolate per site procedure before any inspection.';
const LS='sjm1',CC={R:'#e8710a',T:'#d93025',I:'#1a73e8',F:'#188038',J:'#8e24aa'};
let S={rd:[],al:[],log:[],lv:{},jb:0,range:5,src:'demo',scen:'normal',err:'',page:'dash',lastTs:0,paused:false,off:0,cmp:null,tok:'',
cfg:{name:'Busbar joint #1',id:'ESP32-JM-001',url:'',poll:2,cal:{hx:'',off:'',gain:'',date:''},b:{R:.04,rise:15,F:800,I:100,V:4,Ta:30},w:{R:.4,T:.3,F:.3},th:{R:[.06,.09],T:[65,80],F:[650,520],V:[6,9],I:[120,150]}}};
try{const j=JSON.parse(localStorage.getItem(LS));if(j){S.cfg=Object.assign(S.cfg,j.cfg);S.al=j.al||[];S.log=j.log||[]}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify({cfg:S.cfg,al:S.al.slice(0,200),log:S.log}))}catch(e){}};
/* ---------- data layer: demo or HTTPS source, both call ingest() ---------- */
let dd=0,Tj=45,pt;
function sim(ts){const b=S.cfg.b,n=()=>Math.random()-.5,I=b.I+n()*6,Ta=30+n()*.6,R=b.R*(1+2.2*dd)*(1+n()*.03),F=b.F*(1-(S.scen==='contam'?.03:.42)*dd)+n()*6,tg=Ta+b.rise*(R*I*I)/(b.R*b.I*b.I);Tj+=.15*(tg-Tj)+n()*.2;return{ts,current_a:I,vdrop_mv:R*I,force_n:F,temp_c:Tj,ambient_c:Ta}}
function seed(){S.rd=[];dd=0;Tj=45;const n=Date.now();for(let i=120;i>0;i--)ingest(sim(n-i*1000),true,true)}
function ingest(x,isSim,quiet){const r={ts:+x.ts||Date.now(),I:+x.current_a,mV:+x.vdrop_mv,F:+x.force_n,T:+x.temp_c,Ta:x.ambient_c==null?null:+x.ambient_c,sim:isSim};
if(![[r.I,0,2000],[r.mV,0,500],[r.F,0,5000],[r.T,-40,250]].every(([v,a,b])=>isFinite(v)&&v>=a&&v<=b)){S.err='Reading rejected: missing, non-numeric or out-of-range value.';return}
if(r.I<1){S.err='Reading ignored: current below 1 A, resistance cannot be computed.';return}
r.V=r.mV;r.R=r.mV/r.I;r.P=r.mV/1000*r.I;r.rise=r.T-(r.Ta==null?S.cfg.b.Ta:r.Ta);r.J=jhi(r);
S.rd.push(r);if(S.rd.length>600)S.rd.shift();S.lastTs=r.ts;S.err='';if(quiet)return;
const c=cur();for(const k of['R','T','F','V','I']){const l=lv(k,c[k]),p=S.lv[k]||0;if(l>p)addAlert(l>1?'cr':'wn',k,c[k],l>1?CRIT:MSG[k][0],l>1?CACT:MSG[k][1],isSim);S.lv[k]=l}
const J=jhi(c),ix=J>=90?0:J>=70?1:J>=40?2:3;if(ix>S.jb&&ix>0)addAlert(ix>2?'cr':'wn','J',J,ix>2?CRIT:ix>1?'Abnormal joint condition detected. Inspection recommended.':'Joint Health Index is trending down. Plan an inspection.',ix>2?CACT:'Review the Predictive Maintenance page.',isSim);S.jb=ix}
function cur(){const a=S.rd.slice(-3);return{R:m(a,'R'),T:m(a,'T'),F:m(a,'F'),V:m(a,'V'),I:m(a,'I'),P:m(a,'P'),rise:m(a,'rise'),ts:a[a.length-1].ts}}
function addAlert(sev,k,v,msg,act,sim){S.al.unshift({id:Date.now()+Math.random(),ts:Date.now(),sev,k,v,msg,act,ack:false,sim});S.al=S.al.slice(0,200);save()}
function stopLive(){clearInterval(pt)}
function setSource(s){S.src=s;stopLive();S.rd=[];S.lastTs=0;S.lv={};S.jb=0;S.off=0;S.err='';S.paused=false;
if(s==='demo')seed();else{if(!S.cfg.url)S.err='No endpoint configured. Add the HTTPS endpoint in Device settings.';pt=setInterval(async()=>{if(!S.cfg.url)return;try{const c=new AbortController();setTimeout(()=>c.abort(),5000);const r=await fetch(S.cfg.url,{headers:{Authorization:'Bearer '+S.tok},signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);ingest(await r.json(),false)}catch(e){S.err='Cannot reach device endpoint ('+e.message+'). Readings may be outdated.'}},Math.max(1,S.cfg.poll)*1000)}
drawDemo();render()}
/* ---------- analysis ---------- */
function jhi(r){const b=S.cfg.b,w=S.cfg.w,s=(d,l)=>100*(1-Math.min(Math.max(d/l,0),1));return Math.round((w.R*s(r.R/b.R-1,1.5)+w.T*s(r.rise/b.rise-1,1.5)+w.F*s(1-r.F/b.F,.4))/(w.R+w.T+w.F))}
const bnd=j=>j>=90?{k:'ok',i:'✔',t:'Healthy'}:j>=70?{k:'wn',i:'▲',t:'Trend alert'}:j>=40?{k:'wn',i:'▲',t:'Warning'}:{k:'cr',i:'✖',t:'Critical'};
const lv=(k,v)=>{const t=S.cfg.th[k];return k==='F'?(v<t[1]?2:v<t[0]?1:0):(v>=t[1]?2:v>=t[0]?1:0)};
function conn(){const a=(Date.now()-S.lastTs)/1000,p=Math.max(1,S.cfg.poll);return!S.lastTs||a>p*10?'of':a>p*3?'st':'ok'}
function analyse(){const r=S.rd;if(r.length<10)return null;const b=S.cfg.b,rc=r.slice(-15),pv=r.length>=30?r.slice(-30,-15):r.slice(0,r.length>>1);
const e={R:m(rc,'R')/b.R-1,rise:m(rc,'rise')/b.rise-1,F:1-m(rc,'F')/b.F},t={R:m(rc,'R')/m(pv,'R')-1,T:m(rc,'T')-m(pv,'T'),F:1-m(rc,'F')/m(pv,'F')};
const fl={R:e.R>.25||t.R>.08,T:e.rise>.3||t.T>2,F:e.F>.1||t.F>.04,V:lv('V',m(rc,'V'))>0},p=[];
if(fl.R&&fl.F)p.push(['Rising resistance with declining contact force','Likely bolt loosening or stress relaxation. After isolating per site procedure, check bolt torque and washer preload, and retighten to the specified value.']);
else if(fl.R)p.push(['Rising resistance with stable contact force','Possible surface oxidation or contamination. After isolation, inspect and clean the mating surfaces.']);
else if(fl.F)p.push(['Declining contact force','Early loosening indicator. Schedule a torque check at the next outage and re-verify load-cell calibration.']);
if(fl.T&&fl.R)p.push(['Temperature rising with resistance','Heating is consistent with higher joint loss; supports the degradation pattern above.']);
else if(fl.T)p.push(['Temperature rising without resistance change','Check load current, ambient conditions, ventilation and temperature-sensor placement.']);
if(fl.V)p.push(['Abnormal joint voltage drop','Verify millivolt leads and amplifier offset, then inspect the joint.']);
const J=jhi(cur()),pr=J<40?['cr','Urgent']:J<70?['cr','High']:J<90||p.length?['wn','Medium']:['ok','Low'];return{p,pr,e,t}}
const Classifier={name:'rule-based',run:analyse}; /* swap for a trained model: run() -> {p:[[pattern,action]],pr:[cls,label]} */
/* ---------- views ---------- */
const chip=(c,t)=>`<span class="chip s-${c}">${t}</span>`,sevC=s=>s==='cr'?chip('cr','✖ Critical'):chip('wn','▲ Warning');
const empty=()=>`<div class="card"><b>${S.src==='demo'?'Loading demo data…':'No data yet'}</b><p class=mu>${S.src==='demo'?'':'Waiting for the first reading from the device. Check Device settings and the About page for setup.'}</p></div>`;
function spark(k,col){const a=S.rd.slice(-40);if(a.length<2)return'';const lo=Math.min(...a.map(x=>x[k])),hi=Math.max(...a.map(x=>x[k])),r=hi-lo||1;return`<svg viewBox="0 0 100 24" width=100% height=28 preserveAspectRatio=none aria-hidden=true><polyline fill=none stroke="${col}" stroke-width=1.8 points="${a.map((x,i)=>(i*100/(a.length-1)).toFixed(1)+','+(22-(x[k]-lo)/r*20).toFixed(1)).join(' ')}"/></svg>`}
function sc(k,name,v,bl){const th=k in S.cfg.th,[c,i,t]=LN[th?lv(k,v):0];return`<div class="card b-${c}"><div class=kh><span class=ic2>${IC[k]}</span><span class=l>${name}</span></div><div class=v>${f(v,DG[k])}<small>${U[k]}</small></div>${spark(k,CC[k]||'#00897b')}<div class=kf>${th?chip(c,i+' '+t):'<span></span>'}${bl?`<span class=l>${v>=bl?'▲ +':'▼ '}${f((v/bl-1)*100,0)}% vs base</span>`:''}</div></div>`}
function gauge(J,c){return`<svg viewBox="0 0 140 90" width=200 role=img aria-label="Joint Health Index ${J} of 100"><path d="M10 75A60 60 0 0 1 130 75" fill=none stroke="var(--ln)" stroke-width=12 stroke-linecap=round /><path d="M10 75A60 60 0 0 1 130 75" fill=none stroke="var(--${c})" stroke-width=12 stroke-linecap=round stroke-dasharray="${J/100*188.5} 188.5"/><text x=70 y=68 text-anchor=middle style="font-size:30px;font-weight:700;fill:var(--tx)">${J}</text><text x=70 y=84 text-anchor=middle>JHI / 100</text></svg>`}
const alRows=a=>a.map(x=>`<tr><td>${dt(x.ts)}</td><td>${sevC(x.sev)}</td><td>${NM[x.k]}${x.sim?' <span class=mu>(sim)</span>':''}</td><td>${x.v==null?'—':f(x.v,DG[x.k])+' '+U[x.k]}</td><td>${esc(x.msg)}<br><span class=mu>Action: ${esc(x.act)}</span></td><td>${x.ack?'✔ Acknowledged':`<button data-a=ack data-i="${x.id}">Acknowledge</button>`}</td></tr>`).join('');
const alTbl=a=>a.length?`<div class=sc><table><tr><th>Time<th>Severity<th>Parameter<th>Value<th>Message / action<th>Status</tr>${alRows(a)}</table></div>`:'<p class=mu>None.</p>';
function chart(k,title,bl){const now=Date.now(),pts=S.rd.filter(x=>!S.range||x.ts>=now-S.range*60000),u=U[k];if(pts.length<2)return`<div class=card><b>${title}</b><p class=mu>Not enough data in this range yet.</p></div>`;
const W=640,H=180,L=50,B=22,xs=pts[0].ts,xe=pts[pts.length-1].ts;let lo=Math.min(...pts.map(p=>p[k])),hi=Math.max(...pts.map(p=>p[k]));if(bl!=null){lo=Math.min(lo,bl);hi=Math.max(hi,bl)}if(hi-lo<1e-9){hi++;lo--}const pd=(hi-lo)*.08;lo-=pd;hi+=pd;
const X=t=>L+(t-xs)/(xe-xs||1)*(W-L-8),Y=v=>8+(1-(v-lo)/(hi-lo))*(H-8-B),d=pts.map((p,i)=>(i?'L':'M')+X(p.ts).toFixed(1)+' '+Y(p[k]).toFixed(1)).join('');
return`<div class=card><b>${title} (${u})</b>${pts[0].sim?' <span class=mu>— simulated</span>':''}<div class=sc><svg viewBox="0 0 ${W} ${H}" width=100% style="min-width:420px" role=img aria-label="${title} trend"><path d="M${L} 8V${H-B}H${W-8}" fill=none stroke="var(--ln)"/>${bl!=null?`<path d="M${L} ${Y(bl)}H${W-8}" stroke="var(--mu)" stroke-dasharray="4 4"/><text x=${W-10} y=${Y(bl)-3} text-anchor=end>baseline</text>`:''}<path d="${d}" fill=none stroke="${CC[k]||'var(--ac)'}" stroke-width=2.5 /><text x=${L-4} y=16 text-anchor=end>${f(hi,DG[k])}</text><text x=${L-4} y=${H-B} text-anchor=end>${f(lo,DG[k])}</text><text x=${L} y=${H-6}>${tm(xs)}</text><text x=${W-8} y=${H-6} text-anchor=end>${tm(xe)} · ${u}</text></svg></div></div>`}
const rangeBar=()=>`<div style="margin:8px 0">Range: ${[[1,'1 min'],[5,'5 min'],[0,'All']].map(([v,t])=>`<button data-a=range data-i=${v} class="${S.range===v?'on':''}">${t}</button>`).join(' ')}</div>`;
const banners=()=>{const c=conn();return(S.err?`<div class="bn s-wn">▲ ${esc(S.err)}</div>`:'')+(c==='of'&&S.lastTs?'<div class="bn s-of">○ Device connection lost. Live readings may be outdated.</div>':c==='st'?'<div class="bn s-wn">▲ Readings are stale — last update '+tm(S.lastTs)+'.</div>':'')};
const P={};
P.dash=()=>{if(!S.rd.length)return banners()+empty();const c=cur(),J=jhi(c),B=bnd(J),of=conn()==='of',s=of?['of','○','Offline']:[B.k,B.i,B.t],b=S.cfg.b;
const A=S.rd.length>=10?Classifier.run():null;return banners()+`<div class=dgrid><div><div class="card b-${s[0]} gt">${gauge(J,s[0])}<div><div class=l>Overall joint status</div><div class=v>${chip(s[0],s[1]+' '+s[2])}</div><p>Maintenance priority: ${A?chip(A.pr[0],A.pr[1]):'—'}</p><p class=mu>${A&&A.p.length?esc(A.p[0][0]):'No abnormal pattern detected.'}</p><p class=mu>Updated ${tm(S.lastTs)} · JHI is a prototype indicator, not a safety limit.</p></div></div>
<div class=g>${sc('F','Contact force',c.F,b.F)}${sc('I','Current',c.I)}${sc('V','Joint voltage drop',c.V,b.V)}${sc('R','Joint resistance',c.R,b.R)}${sc('T','Joint temperature',c.T)}${sc('P','Joint power loss',c.P)}${sc('rise','Temperature rise',c.rise,b.rise)}</div>
</div><div>${chart('J','Joint health trend (JHI)')}<div class=card><b>Recent alerts</b>${S.al.slice(0,5).map(x=>`<div style="display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--ln)">${sevC(x.sev)}<div>${esc(x.msg)}<br><span class=mu>${tm(x.ts)} · ${NM[x.k]}</span></div></div>`).join('')||'<p class=mu>No alerts.</p>'}</div></div></div>`};
P.live=()=>{if(!S.rd.length)return banners()+empty();const b=S.cfg.b;return banners()+`<p class=mu>Last update: ${dt(S.lastTs)}</p>${rangeBar()}<div class=cg>${chart('R','Joint resistance',b.R)}${chart('T','Joint temperature',b.Ta+b.rise)}${chart('I','Current',b.I)}${chart('F','Contact force',b.F)}</div>`};
function cmpHtml(){const r=S.log[S.cmp];if(!r)return'<p class=mu>Select a record above to compare readings before and after it was saved.</p>';const bf=S.rd.filter(x=>x.ts<r.ts).slice(-30),af=S.rd.filter(x=>x.ts>=r.ts).slice(0,30);
if(!bf.length||!af.length)return'<p class=mu>Not enough readings on both sides of this record (needs data before and after it was saved).</p>';
return`<div class=sc><table><tr><th>Mean of ≤30 readings<th>Before<th>After<th>Change</tr>${[['R','Resistance'],['rise','Temp. rise'],['F','Force'],['J','JHI']].map(([k,n])=>{const a=m(bf,k),z=m(af,k);return`<tr><td>${n} (${U[k]})<td>${f(a,DG[k])}<td>${f(z,DG[k])}<td>${(z-a>=0?'+':'')+f(a?(z/a-1)*100:0,1)}%</tr>`}).join('')}</table></div>`}
P.pm=()=>{if(S.rd.length<10)return banners()+empty()+'<p class=mu>At least 10 readings are needed for trend analysis.</p>';const A=Classifier.run(),c=cur(),b=S.cfg.b,J=jhi(c);
return banners()+`<div class="card b-${A.pr[0]}"><div class=l>Maintenance priority (${Classifier.name} analysis)</div><div class=v>${chip(A.pr[0],A.pr[1])}</div><p>JHI now: <b>${J}</b> — ${bnd(J).t}</p></div>${rangeBar()}${chart('J','Joint health trend (JHI)')}
<h2>Abnormal-pattern summary and recommended inspection</h2><div class=card>${A.p.length?A.p.map(x=>`<p><b>${x[0]}</b><br>${x[1]}</p>`).join(''):'<p>No persistent abnormal pattern versus baseline.</p>'}<p class=mu>Remaining useful life is not estimated: that needs validated failure-history data. Always follow the approved safety procedure.</p></div>
<h2>Current vs healthy baseline</h2><div class="card sc"><table><tr><th>Parameter<th>Current<th>Baseline<th>Deviation</tr>${[['R',c.R,b.R],['rise',c.rise,b.rise],['F',c.F,b.F],['V',c.V,b.V]].map(([k,v,x])=>`<tr><td>${NM[k]||'Temp. rise'} (${U[k]})<td>${f(v,DG[k])}<td>${f(x,DG[k])}<td>${(v>=x?'+':'')+f((v/x-1)*100,1)}%</tr>`).join('')}</table></div>
<h2>Before / after maintenance</h2><div class=card>${S.log.length?S.log.slice(0,6).map((r,i)=>`<button data-a=cmp data-i=${i} class="${S.cmp===i?'on':''}">${esc(r.date)} · ${esc(r.act)}</button>`).join(' '):'<p class=mu>No maintenance records yet. Add one on the Maintenance records page.</p>'}${cmpHtml()}</div>`};
P.al=()=>{const a=S.al.filter(x=>!x.ack);return banners()+`<h2>Active (unacknowledged) alerts</h2><div class=card>${alTbl(a)}${a.length?'<button data-a=ackall>Acknowledge all</button>':''}</div><h2>Alert history</h2><div class=card>${S.al.length?alTbl(S.al):'<p class=mu>No alerts recorded yet.</p>'}</div>`};
const ip=(id,l,v,t)=>`<label class=l>${l}<input id="${id}" type="${t||'text'}" value="${esc(v)}" ${t==='number'?'step=any':''}></label>`;
P.set=()=>{const c=S.cfg,b=c.b,th=c.th,w=c.w;return`<div id=msg></div><h2>Device and data source</h2><div class="card f">${ip('d_name','Device name',c.name)}${ip('d_id','Device identifier',c.id)}<label class=l>Data source<select id=d_src><option value=demo ${S.src==='demo'?'selected':''}>Demo (simulated)</option><option value=https ${S.src==='https'?'selected':''}>Live — HTTPS polling</option></select></label>${ip('d_url','HTTPS endpoint (https://…)',c.url)}${ip('d_tok','Device token (kept in memory only)',S.tok,'password')}${ip('d_poll','Expected interval (s)',c.poll,'number')}<p class=l>Status: ${{ok:'✔ Online',st:'▲ Stale',of:'○ Offline'}[conn()]} · Last update: ${S.lastTs?dt(S.lastTs):'never'}</p></div>
<h2>Sensor calibration information</h2><div class="card f">${ip('c_hx','HX711 scale factor',c.cal.hx)}${ip('c_off','HX711 zero offset',c.cal.off)}${ip('c_gain','mV amplifier gain',c.cal.gain)}${ip('c_date','Last calibration date',c.cal.date,'date')}</div>
<h2>Healthy baseline</h2><div class="card f">${ip('b_R','Resistance (mΩ)',b.R,'number')}${ip('b_rise','Temp. rise (°C)',b.rise,'number')}${ip('b_F','Force (N)',b.F,'number')}${ip('b_I','Current (A)',b.I,'number')}${ip('b_V','Voltage drop (mV)',b.V,'number')}${ip('b_Ta','Assumed ambient (°C)',b.Ta,'number')}<div><button data-a=capture>Capture from last 30 readings</button><p class=mu>Only capture while the joint is known to be healthy.</p></div></div>
<h2>Thresholds (warning / critical)</h2><div class="card f">${['R','T','F','V','I'].map(k=>ip('tw_'+k,NM[k]+' warn ('+U[k]+')',th[k][0],'number')+ip('tc_'+k,'critical',th[k][1],'number')).join('')}<p class=mu>Contact force alerts when it falls below the value; others when they rise above.</p></div>
<h2>JHI weights</h2><div class="card f">${ip('w_R','Resistance',w.R,'number')}${ip('w_T','Temperature',w.T,'number')}${ip('w_F','Force',w.F,'number')}</div><button class=on data-a=saveset>Save settings</button>`};
P.rec=()=>`<div id=msg></div><h2>New record</h2><div class="card f">${ip('r_date','Inspection date',new Date().toISOString().slice(0,10),'date')}<label class=l>Action<select id=r_act>${['Inspection','Cleaning','Tightening','Component replacement','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label>${ip('r_prob','Identified problem','')}${ip('r_comp','Components replaced','')}${ip('r_notes','Notes','')}<label class=l>Follow-up<select id=r_fu><option>None</option><option>Open</option><option>Done</option></select></label><div><button class=on data-a=addrec>Add record</button></div></div>
<h2>Records</h2><div class="card sc">${S.log.length?`<table><tr><th>Date<th>Problem<th>Action<th>Replaced<th>Notes<th>Follow-up</tr>${S.log.map((r,i)=>`<tr><td>${esc(r.date)}<td>${esc(r.prob)}<td>${esc(r.act)}<td>${esc(r.comp)}<td>${esc(r.notes)}<td>${r.fu==='Open'?`<button data-a=tgl data-i=${i}>▲ Open — mark done</button>`:r.fu==='Done'?'✔ Done':'—'}</tr>`).join('')}</table>`:'<p class=mu>No maintenance records yet.</p>'}</div>`;
P.about=()=>`<div class=card><h2>Purpose</h2><p>Smart Joint Monitor tracks a bolted copper-busbar joint using an ESP32 with a differential millivolt circuit, a current sensor, an HX711 load cell and a DS18B20 temperature sensor. Combining electrical, thermal and mechanical readings helps flag joint deterioration before failure. B.Tech EEE final-year project prototype.</p>
<h2>Joint Health Index</h2><p>Each of resistance rise (limit +150%), temperature-rise increase (+150%) and force loss (−40%) relative to the stored healthy baseline is scored 0–100, then combined with configurable weights. Demo bands, subject to experimental validation: 90–100 Healthy, 70–89 Trend alert, 40–69 Warning, below 40 Critical. They are not electrical safety standards.</p>
<h2>Works now in Demo mode</h2><p>Dashboard, JHI gauge, charts, baseline comparison, rule-based pattern detection, recommendations, alert history and acknowledgement, maintenance log, before/after comparison, threshold validation, stale/offline states (use “Simulate device dropout”). Settings, alerts and records persist in this browser only.</p>
<h2>Needs real hardware or services</h2><p>Live readings (ESP32 + Wi-Fi + a backend), secure device authentication, push notifications (e.g. Firebase Cloud Messaging), multi-user storage, MQTT (needs a broker and a backend or WebSocket bridge), and any trained AI classifier. This published page cannot call other websites; for live HTTPS polling, host the file on your own server with CORS enabled on the device endpoint.</p>
<h2>Connecting the ESP32</h2><p>1. Have the ESP32 (or your backend) serve JSON over HTTPS, for example:<br><code>{"ts":1760000000000,"current_a":100.2,"vdrop_mv":4.1,"force_n":805,"temp_c":46.2,"ambient_c":30.1}</code> (ts is Unix ms; ambient optional).<br>2. In Device settings choose Live — HTTPS polling and enter the endpoint and token.<br>3. Keep Wi-Fi credentials, tokens and API keys in the ESP32 secrets file or backend environment, never in public code. Use TLS and per-device tokens.<br>4. Calibrate the HX711 and the millivolt amplifier, then capture the healthy baseline.</p>
<h2>Credentials to configure</h2><p>Wi-Fi SSID/password (firmware only), backend or IoT-platform endpoint and per-device token (Firebase, Blynk, ThingSpeak or custom), MQTT broker host/user/password if used, push-notification service key, and the hosting domain for this page.</p>
<h2>Safety</h2><p>Overcurrent, over-temperature and disconnect protection must run locally on the ESP32 or a dedicated protection circuit. This app is for monitoring and must never be the only way an unsafe load is disconnected.</p></div>`;
/* ---------- chrome ---------- */
function render(){const n=S.al.filter(x=>!x.ack).length,cs=conn();$('#nav').innerHTML='<div class=br>⚡ Smart Joint Monitor</div>'+NAV.map(([k,t,ic,sh])=>`<button data-a=nav data-i=${k} class="${S.page===k?'on':''}"><span class=ic>${ic}</span><span class=tx>${t}</span><span class=sh>${sh}</span>${k==='al'&&n?`<b class=bd>${n}</b>`:''}</button>`).join('')+`<div class=dv><b>${esc(S.cfg.name)}</b><br>${esc(S.cfg.id)}<br>${{ok:'✔ Online',st:'▲ Stale',of:'○ Offline'}[cs]} · ${S.src==='demo'?'Simulated':'Live'}</div>`;$('#ttl').textContent=NAV.find(x=>x[0]===S.page)[1];$('#main').innerHTML=P[S.page]();hdr()}
function hdr(){const c=conn(),[k,t]={ok:['ok','✔ Device online'],st:['wn','▲ Stale data'],of:['of','○ Device offline']}[c];$('#hd').innerHTML=`${S.src==='demo'?chip('wn','SIMULATED DATA'):chip('ok','LIVE')} ${chip(k,t)} <span class=mu>${S.lastTs?'Updated '+tm(S.lastTs):'No data yet'}</span>`}
function drawDemo(){$('#demo').innerHTML=S.src==='demo'?`<div class="card b-wn"><b>▲ DEMO MODE — simulated readings. No physical device is connected.</b><div class=f style="margin-top:8px"><label class=l>Scenario<select id=sn><option value=normal ${S.scen==='normal'?'selected':''}>Healthy joint</option><option value=loosen ${S.scen==='loosen'?'selected':''}>Loosening bolt</option><option value=contam ${S.scen==='contam'?'selected':''}>Contaminated surface</option></select></label><label class=l style="align-self:end"><input type=checkbox id=dr ${S.paused?'checked':''}> Simulate device dropout</label><div style="align-self:end"><button id=tg>Simulate tightening</button></div></div></div>`:`<div class="card b-ok"><b>● LIVE source: HTTPS polling</b> <span class=mu>${esc(S.cfg.url||'no endpoint configured')}</span></div>`;
if(S.src==='demo'){$('#sn').onchange=e=>{S.scen=e.target.value};$('#dr').onchange=e=>{S.paused=e.target.checked};$('#tg').onclick=()=>{dd=0;S.scen='normal';$('#sn').value='normal';S.log.unshift({ts:Date.now(),date:new Date().toISOString().slice(0,10),prob:'Simulated degradation',act:'Tightening',comp:'',notes:'Demo-mode simulated tightening',fu:'None'});save();render()}}}
const msg=(t,ok)=>{const e=$('#msg');if(e)e.innerHTML=`<div class="bn ${ok?'s-ok':'s-cr'}">${t}</div>`};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i,g=id=>$('#'+id).value,n=id=>parseFloat(g(id));
if(a==='nav'){S.page=i;render()}
else if(a==='range'){S.range=+i;render()}
else if(a==='cmp'){S.cmp=+i;render()}
else if(a==='ack'){const x=S.al.find(y=>String(y.id)===i);if(x)x.ack=true;save();render()}
else if(a==='ackall'){S.al.forEach(x=>x.ack=true);save();render()}
else if(a==='tgl'){S.log[+i].fu='Done';save();render()}
else if(a==='addrec'){if(!g('r_prob').trim()&&!g('r_notes').trim()){msg('Enter an identified problem or a note.');return}S.log.unshift({ts:Date.now(),date:g('r_date'),prob:g('r_prob'),act:g('r_act'),comp:g('r_comp'),notes:g('r_notes'),fu:g('r_fu')});save();render()}
else if(a==='capture'){if(S.rd.length<10){msg('Need at least 10 readings first.');return}const r=S.rd.slice(-30),b=S.cfg.b;Object.assign(b,{R:m(r,'R'),rise:m(r,'rise'),F:m(r,'F'),I:m(r,'I'),V:m(r,'V')});save();render();msg('Baseline captured from the last '+r.length+' readings.',1)}
else if(a==='saveset'){const er=[],th={};for(const k of['R','T','F','V','I']){const w=n('tw_'+k),c=n('tc_'+k);if(!(w>0&&c>0))er.push(NM[k]+': thresholds must be positive numbers.');else if(k==='F'?w<=c:w>=c)er.push(NM[k]+': '+(k==='F'?'warning must be above critical.':'warning must be below critical.'));th[k]=[w,c]}
const b={R:n('b_R'),rise:n('b_rise'),F:n('b_F'),I:n('b_I'),V:n('b_V'),Ta:n('b_Ta')};for(const k in b)if(!isFinite(b[k])||(k!=='Ta'&&b[k]<=0))er.push('Baseline '+k+' must be a valid positive number.');
const w={R:n('w_R'),T:n('w_T'),F:n('w_F')};if(!Object.values(w).every(v=>v>=0)||w.R+w.T+w.F<=0)er.push('Weights must be non-negative with a positive sum.');
const pl=n('d_poll'),u=g('d_url').trim();if(!(pl>=1))er.push('Interval must be at least 1 s.');if(u&&!/^https:\/\//i.test(u))er.push('Endpoint must start with https://');
if(er.length){msg(er.map(esc).join('<br>'));return}
const c=S.cfg;Object.assign(c,{name:g('d_name'),id:g('d_id'),url:u,poll:pl,th,b,w,cal:{hx:g('c_hx'),off:g('c_off'),gain:g('c_gain'),date:g('c_date')}});S.tok=g('d_tok');save();const s=g('d_src');if(s!==S.src||s==='https')setSource(s);msg('Settings saved.',1)}});
setInterval(()=>{if(S.src==='demo'&&!S.paused){if(S.scen!=='normal')dd=Math.min(1,dd+.004);ingest(sim(Date.now()),true)}
const c=conn();if(S.lastTs&&c==='of'&&!S.off){S.off=1;addAlert('wn','C',null,'Device connection lost. Live readings may be outdated.','Check device power and Wi-Fi.',S.src==='demo')}if(c!=='of')S.off=0;
hdr();if(['dash','live','pm','al'].includes(S.page))render()},1000);
setSource('demo');
</script></body></html>
